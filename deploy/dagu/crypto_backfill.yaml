# Dagu DAG: CryptoQuant candle + technical-analysis backfill
#
# Replaces the previous APScheduler long-running process (scripts/run_scheduler.py).
# Runs every 4 hours. If the mini PC was down (e.g. power cut), Dagu's catchup_window
# replays missed scheduled runs on restart. In addition, scripts/run_backfill.py is
# idempotent and self-healing: every run scans from the last stored DB timestamp to
# "now", so any gap size is caught up regardless of how the run was triggered.
#
# Setup: see docs/deployment/MINI_PC_SETUP.md (Phase 4)
# Validate: dagu validate deploy/dagu/crypto_backfill.yaml
# Manual run: dagu start deploy/dagu/crypto_backfill.yaml

name: crypto_backfill
working_dir: D:\crypto
schedule: "0 */4 * * *"
catchup_window: "3d"
overlap_policy: skip
timeout_sec: 7200

steps:
  - id: backfill_candles
    run: .venv\Scripts\python.exe scripts\run_backfill.py --type candles
    retry_policy:
      limit: 2
      interval_sec: 60

  - id: backfill_analysis
    run: .venv\Scripts\python.exe scripts\run_backfill.py --type analysis
    depends: backfill_candles
    retry_policy:
      limit: 2
      interval_sec: 60

# Template for %USERPROFILE%\.config\dagu\config.yaml; deploy/ps/dagu-setup.ps1 appends
# the machine-specific paths.dags_dir so no absolute path lives in git.

# Required for catchup_window (missed-run replay); otherwise catch-up is silently skipped.
queues:
  enabled: true

# Local-only mini PC: skip the built-in login/setup prompt.
auth:
  mode: none

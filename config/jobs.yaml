# CryptoQuant Scheduler Job Configuration
# 
# This file defines all scheduled jobs. The scheduler reads this on startup
# and creates jobs dynamically. No code changes needed to add/modify jobs.
#
# Job types:
#   - cron: Schedule at specific times (daily, hourly, etc.)
#   - interval: Run every N minutes/hours
#
# Common cron examples:
#   "0 2 * * *"     - Daily at 2:00 AM
#   "0 */4 * * *"   - Every 4 hours
#   "0 0 * * 0"     - Every Sunday at midnight
#   "30 1 * * 1-5"  - Weekdays at 1:30 AM

jobs:
  - id: incremental_ingestion
    name: "Incremental OHLCV Data Ingestion"
    enabled: true
    run_on_startup: false
    type: interval
    interval_minutes: 240
    function: incremental_ingestion_job
    parameters:
      granularity: hourly

  - id: incremental_technical_analysis
    name: "Incremental Technical Analysis"
    enabled: false
    run_on_startup: false
    type: interval
    interval_minutes: 240
    function: incremental_technical_analysis_job
    parameters:
      calculation_version: v1

  - id: historic_ingestion
    name: "Historic OHLCV Data Ingestion"
    enabled: false
    run_on_startup: false
    type: cron
    cron: "0 2 * * *"
    function: historic_ingestion_job
    parameters:
      granularity: daily
      lookback_days: 7
